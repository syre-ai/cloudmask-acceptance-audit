[project]
name = "cloudmask-acceptance-audit"
version = "0.1.0"
description = "Imagery-acceptance assurance audit of the OmniCloudMask cloud and shadow model on CloudSEN12+"
requires-python = ">=3.11,<3.13"
dependencies = [
    "omnicloudmask==1.8.1",
    "torch==2.10.0",
    "tacoreader==0.5.6",
    "rasterio",
    "numpy",
    "pandas",
    "pyarrow",
    "geopandas",
    "shapely",
    "matplotlib",
    "tqdm",
    "requests>=2.34.2",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
